<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300">
  <style>
    .wall{fill:#fff;stroke:#000;stroke-width:10;stroke-linejoin:miter}.line{fill:none;stroke:#000;stroke-width:3}.heavy{fill:none;stroke:#000;stroke-width:6}.thin{fill:none;stroke:#000;stroke-width:2}.dash{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:10 8}.channel{fill:#eee;stroke:#000;stroke-width:2}.furniture{fill:#f5f5f5;stroke:#000;stroke-width:3}.label{font: 22px Arial,sans-serif;letter-spacing:1px}.small{font:16px Arial,sans-serif;letter-spacing:.5px}.tiny{font:13px Arial,sans-serif}.title{font:bold 30px Arial,sans-serif;letter-spacing:2px}
  </style>
  <rect width="1600" height="1300" fill="white"/>
  <text x="800" y="65" text-anchor="middle" class="title">UNDERGROUND PIRATE RADIO STATION — ORTHOGRAPHIC FLOOR-PLAN STUDY</text>
  <text x="800" y="96" text-anchor="middle" class="small">DIRECTLY ABOVE • USABLE INTERNAL ROOM: 8.0 m × 6.5 m • BLACK LINEWORK</text>

  <!-- usable room: x=340..1140 / y=180..830, 100 px/m -->
  <rect x="340" y="180" width="800" height="650" class="wall"/>
  <!-- recessed removable wall-base cable channels -->
  <path d="M354 194V816 M1126 194V816" class="channel" stroke-width="18"/>
  <path d="M354 194V816 M1126 194V816" class="thin" stroke-dasharray="8 5"/>
  <text x="318" y="500" transform="rotate(-90 318 500)" class="tiny">RECESSED CABLE CHANNEL / REMOVABLE METAL PLATES</text>
  <text x="1165" y="500" transform="rotate(90 1165 500)" class="tiny">RECESSED CABLE CHANNEL / REMOVABLE METAL PLATES</text>

  <!-- stair is outside usable room at near-left cold corner -->
  <rect x="190" y="590" width="150" height="240" class="wall"/>
  <path d="M205 615H325 M205 645H325 M205 675H325 M205 705H325 M205 735H325 M205 765H325 M205 795H325" class="thin"/>
  <path d="M265 620V795 M250 635l15-15 15 15 M250 780l15 15 15-15" class="line"/>
  <text x="265" y="730" text-anchor="middle" class="small" transform="rotate(-90 265 730)">STAIR DOWN</text>
  <text x="263" y="850" text-anchor="middle" class="tiny">1.2 m WIDE</text>
  <!-- entry opening -->
  <path d="M340 660V760" stroke="white" stroke-width="15"/><path d="M340 660 A100 100 0 0 1 440 760" class="line"/>

  <!-- south: cold / control zone -->
  <text x="720" y="792" text-anchor="middle" class="label">COLD / ENTRY + CONTROL ZONE</text>
  <rect x="360" y="530" width="70" height="240" class="furniture"/>
  <text x="395" y="630" transform="rotate(-90 395 630)" text-anchor="middle" class="small">REPAIR BENCH</text>
  <text x="395" y="650" transform="rotate(-90 395 650)" text-anchor="middle" class="tiny">2.4 m × 0.7 m</text>
  <!-- repair cables to channel --> <path d="M430 570H354 M430 640H354 M430 710H354" class="thin"/>
  <rect x="1036" y="650" width="90" height="166" class="furniture"/>
  <path d="M1036 665h-15v136h15 M1126 665h15v136h-15" class="thin"/>
  <text x="1081" y="720" text-anchor="middle" class="small" transform="rotate(-90 1081 720)">WAITING / COUCH</text>
  <text x="1104" y="720" text-anchor="middle" class="tiny" transform="rotate(-90 1104 720)">1.8 m LONG</text>
  <path d="M1056 650V816 M1096 650V816" class="thin"/>
  <circle cx="720" cy="650" r="18" class="heavy"/><path d="M707 637l26 26M733 637l-26 26" class="thin"/><text x="720" y="690" text-anchor="middle" class="small">FLOOR DRAIN</text>
  <!-- main route -->
  <path d="M500 780H540 V700 H570" class="dash"/>
  <text x="700" y="812" text-anchor="middle" class="tiny">OPEN MAIN ROUTE — 1.5 m MIN. CLEAR</text>

  <!-- floating floor field, exactly an extent not treated as wall -->
  <path d="M525 705H925V400H1125V195H450V400H525Z" fill="#f7f7f7" stroke="#000" stroke-width="2" stroke-dasharray="12 6"/>
  <text x="770" y="220" text-anchor="middle" class="small">FLOATING FLOOR PLATFORM EXTENT</text>

  <!-- full-width partition: control south / performance north; east door gap is 1.1 m -->
  <path d="M354 400H1015 M1125 400H1126" class="heavy"/>
  <text x="930" y="438" text-anchor="middle" class="tiny">FULL-HEIGHT ACOUSTIC PARTITION</text>
  <path d="M1015 400 A110 110 0 0 1 1125 510" class="line"/>
  <text x="1070" y="535" text-anchor="middle" class="tiny">DOOR TO PERFORMANCE</text>
  <text x="1070" y="553" text-anchor="middle" class="tiny">1.1 m OPENING</text>
  <!-- observation window -->
  <rect x="620" y="387" width="240" height="26" fill="white" stroke="black" stroke-width="3"/>
  <path d="M625 408L645 390 M655 408L675 390 M685 408L705 390 M715 408L735 390 M745 408L765 390 M775 408L795 390 M805 408L825 390 M835 408L855 390" class="thin"/>
  <text x="740" y="380" text-anchor="middle" class="tiny">OBSERVATION WINDOW — 2.4 m WIDE, CENTERED</text>

  <!-- east side corridor on south side: waiting area to partition door -->
  <path d="M1015 630V400 H1125" class="dash"/>
  <text x="995" y="510" class="tiny" transform="rotate(-90 995 510)">SIDE CORRIDOR — 1.1 m MIN. CLEAR</text>

  <!-- control desk -->
  <rect x="570" y="505" width="200" height="160" class="furniture"/>
  <rect x="590" y="523" width="160" height="55" class="thin"/>
  <circle cx="670" cy="630" r="28" class="line"/>
  <path d="M620 505v-18 M720 505v-18" class="thin"/>
  <text x="670" y="598" text-anchor="middle" class="small">CONTROL / MIX DESK</text>
  <text x="670" y="620" text-anchor="middle" class="tiny">2.0 m × 1.6 m incl. chair clearance</text>
  <text x="670" y="470" text-anchor="middle" class="label">CONTROL POSITION — FACING NORTH</text>

  <!-- performance zone -->
  <text x="710" y="250" text-anchor="middle" class="label">PERFORMANCE AREA</text>
  <circle cx="760" cy="315" r="46" class="line"/><circle cx="760" cy="315" r="18" class="line"/>
  <path d="M705 375L720 340 M815 375L800 340 M760 361V385 M740 385H780" class="line"/>
  <text x="760" y="392" text-anchor="middle" class="tiny">DRUMS / MICS</text>
  <path d="M500 260v105 M475 290h50 M475 335h50" class="line"/><text x="540" y="325" class="tiny">INSTRUMENTS</text>
  <path d="M500 260H354 M500 320H354" class="thin"/>

  <!-- isolation booth top right, 2m x2m exactly -->
  <rect x="925" y="195" width="200" height="200" class="wall"/>
  <path d="M925 395H1005" stroke="white" stroke-width="15"/><path d="M1005 395 A80 80 0 0 1 925 315" class="line"/>
  <text x="1025" y="280" text-anchor="middle" class="small">ISOLATION</text><text x="1025" y="305" text-anchor="middle" class="small">BOOTH</text><text x="1025" y="330" text-anchor="middle" class="tiny">2.0 m × 2.0 m</text>
  <text x="960" y="425" class="tiny">DOOR TO PERFORMANCE</text>
  <rect x="900" y="360" width="18" height="35" fill="white" stroke="black" stroke-width="2"/><text x="893" y="352" text-anchor="end" class="tiny">STATUS</text>
  <path d="M925 240H1126 M925 300H1126" class="thin"/>

  <!-- unknown notes -->
  <rect x="1220" y="210" width="310" height="290" class="line"/>
  <text x="1240" y="245" class="label">UNKNOWNS — DO NOT INFER</text>
  <text x="1240" y="290" class="small">UNKNOWN:</text><text x="1240" y="315" class="small">ACOUSTIC TREATMENT</text><text x="1240" y="350" class="small">UNKNOWN:</text><text x="1240" y="375" class="small">ELECTRICAL DISTRIBUTION /</text><text x="1240" y="398" class="small">WALL PENETRATIONS</text><text x="1240" y="435" class="small">UNKNOWN:</text><text x="1240" y="460" class="small">STRUCTURAL CAPACITY FOR</text><text x="1240" y="483" class="small">FLOATING FLOOR</text>
  <!-- legend -->
  <rect x="1220" y="550" width="310" height="190" class="line"/>
  <text x="1240" y="585" class="label">LEGEND</text>
  <path d="M1240 620H1320" class="dash"/><text x="1340" y="626" class="small">CLEAR ROUTE</text>
  <path d="M1240 660H1320" class="line" stroke-width="18"/><path d="M1240 660H1320" class="thin" stroke-dasharray="8 5"/><text x="1340" y="666" class="small">CABLE CHANNEL</text>
  <path d="M1240 705H1320" stroke="#000" stroke-width="2" stroke-dasharray="12 6"/><text x="1340" y="711" class="small">FLOATING FLOOR EDGE</text>
  <text x="340" y="900" class="small">NOTES: ALL SHOWN DIMENSIONS ARE USER-PROVIDED. STAIR FOOTPRINT IS EXCLUDED FROM THE 8.0 m × 6.5 m USABLE ROOM.</text>
</svg>
